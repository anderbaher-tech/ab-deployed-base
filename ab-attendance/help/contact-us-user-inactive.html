<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | User Inactive | AB Attendance</title>
  <meta
    name="description"
    content="Support page for users whose AB Attendance account is currently inactive."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./contact-us.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <img src="./assets/full_logo.png" alt="Ander Baher logo" />
      </div>
      <div class="art">
        <img
          src="./assets/contact-us-image.png"
          alt="Illustration of people near a mailbox and support letters"
        />
      </div>
      <h1>User Inactive</h1>
      <p class="error-text">
        Access is currently unavailable because this user account has been marked as inactive.
        If you believe this status is incorrect, please contact our support team for assistance.
      </p>
      <div class="contact-block">
        <p class="contact-title">Contact Us</p>
        <p class="contact-copy">
          For help with user account status, please write to our support team.
        </p>
        <a class="email-link" href="mailto:care@anderbaher.com?subject=AB%20Attendance%20Support%20-%20User%20Inactive">
          care@anderbaher.com
        </a>
      </div>
    </section>
  </main>
</body>
</html>
